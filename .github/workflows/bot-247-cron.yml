name: Bot 24/7 Backup Automation

on:
  schedule:
    # Run every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type (scheduled, manual, backup-only)"
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - manual
          - backup-only

jobs:
  backup-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Cloudflare Worker deployment
        env:
          # Supabase Configuration
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Upstash Redis Configuration
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}

          # Upstash QStash Configuration
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}

          # X (Twitter) API Configuration
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_KEY_SECRET: ${{ secrets.X_CONSUMER_KEY_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

          # Lazada API Configuration
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_MEMBER_ID: ${{ secrets.LAZADA_MEMBER_ID }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_LITEAPP_KEY: ${{ secrets.LAZADA_LITEAPP_KEY }}
          LAZADA_LITEAPP_SECRET: ${{ secrets.LAZADA_LITEAPP_SECRET }}

          # Shopee Affiliate API Configuration
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}
          SHOPEE_AFFILIATE_API_BASE_URL: ${{ secrets.SHOPEE_AFFILIATE_API_BASE_URL }}

          # OpenRouter AI Configuration
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Backblaze B2 Configuration
          BACKBLAZE_B2_ACCOUNT_ID_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_1 }}
          BACKBLAZE_B2_ACCOUNT_KEY_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_1 }}
          BACKBLAZE_B2_ACCOUNT_ID_2: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_2 }}
          BACKBLAZE_B2_ACCOUNT_KEY_2: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_2 }}
          BACKBLAZE_B2_ACCOUNT_ID_3: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_3 }}
          BACKBLAZE_B2_ACCOUNT_KEY_3: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_3 }}

          # Cloudflare Configuration
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          # Discord Webhook for alerts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          echo "🚀 Starting Bot 24/7 Backup Automation"
          echo "📅 Trigger: ${{ github.event_name }}"
          echo "🏷️  Run type: ${{ github.event.inputs.run_type }}"
          echo "⏰ Timestamp: $(date -Iseconds)"

          # Deploy the Cloudflare Worker
          npx wrangler deploy

      - name: Verify Worker Health
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          echo "🔍 Verifying worker health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/health")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Worker health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Worker health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Run Database Backup
        if: github.event.inputs.run_type == 'backup-only' || github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKBLAZE_B2_ACCOUNT_ID_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_1 }}
          BACKBLAZE_B2_ACCOUNT_KEY_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_1 }}
          B2_BACKUP_BUCKET_NAME: ${{ secrets.B2_BACKUP_BUCKET_NAME }}
        run: |
          echo "💾 Running daily database backup..."
          node bin/daily-db-backup.js

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Backup automation completed successfully"
          echo "📊 All systems operational"

      - name: Notify on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "❌ Backup automation failed"
          if [ ! -z "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data '{"content":"🚨 Bot 24/7 Backup Automation Failed\n🔍 Check workflow logs for details\n⏰ Time: '$(date -Iseconds)'"}'
          fi

      - name: Generate Backup Report
        if: always()
        run: |
          echo "📊 Generating backup report..."
          cat << EOF > backup-report.md
          # Bot 24/7 Backup Automation Report

          **Date:** $(date -Iseconds)
          **Status:** $(if [ "\${{ job.status }}" == 'success' ]; then echo '✅ SUCCESS'; else echo '❌ FAILURE'; fi)
          **Trigger:** ${{ github.event_name }}
          **Run Type:** ${{ github.event.inputs.run_type }}
          **Workflow:** bot-247-cron.yml
          **Repository:** braderdin/racun-dapur-ibu-bot
          EOF
          echo "📄 Backup report saved"
