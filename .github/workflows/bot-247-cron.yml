name: Bot 24/7 Backup Automation

on:
  schedule:
    # Run every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type (scheduled, manual, backup-only)"
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - manual
          - backup-only

jobs:
  backup-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Backup Automation
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "🚀 Starting Bot 24/7 Backup Automation"
          echo "📅 Trigger: ${{ github.event_name }}"
          echo "🏷️  Run type: ${{ github.event.inputs.run_type }}"
          echo "⏰ Timestamp: $(date -Iseconds)"

      - name: Run Database Backup
        if: github.event.inputs.run_type == 'backup-only' || github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKBLAZE_B2_ACCOUNT_ID_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_1 }}
          BACKBLAZE_B2_ACCOUNT_KEY_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_1 }}
          B2_BACKUP_BUCKET_NAME: ${{ secrets.B2_BACKUP_BUCKET_NAME }}
        run: |
          echo "💾 Running daily database backup..."
          node bin/daily-db-backup.js

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Backup automation completed successfully"
          echo "📊 All systems operational"

      - name: Notify on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "❌ Backup automation failed"
          if [ ! -z "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data '{"content":"🚨 Bot 24/7 Backup Automation Failed\n🔍 Check workflow logs for details\n⏰ Time: '$(date -Iseconds)'"}'
          fi

      - name: Generate Backup Report
        if: always()
        run: |
          echo "📊 Generating backup report..."
          cat << EOF > backup-report.md
          # Bot 24/7 Backup Automation Report

          **Date:** $(date -Iseconds)
          **Status:** $(if [ "\${{ job.status }}" == 'success' ]; then echo '✅ SUCCESS'; else echo '❌ FAILURE'; fi)
          **Trigger:** ${{ github.event_name }}
          **Run Type:** ${{ github.event.inputs.run_type }}
          **Workflow:** bot-247-cron.yml
          **Repository:** braderdin/racun-dapur-ibu-bot
          EOF
          echo "📄 Backup report saved"
