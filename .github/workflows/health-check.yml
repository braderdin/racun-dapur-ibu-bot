name: Worker Health Check

on:
  schedule:
    # Run every hour during peak hours (12:30 PM - 2:00 PM) and evening (8:30 PM - 10:30 PM)
    - cron: "*/30 * 12-13,20-21 * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type (scheduled, manual)"
        required: false
        default: "scheduled"
        type: choice
        options:
          - scheduled
          - manual

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up environment variables
        run: |
          echo "Setting up environment variables"
          echo "HEALTH_ENDPOINT=https://worker.ray.com/health" >> $GITHUB_ENV

      - name: Perform Health Check
        run: |
          echo "🔍 Performing health check..."

          # Try the health endpoint
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed"
            curl -s "$HEALTH_ENDPOINT" | jq .
          else
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Health check completed successfully"
          echo "📊 Worker is healthy and operational"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Health check failed"
          echo "🔍 Worker may be unhealthy or unreachable"
          echo "📋 Please check worker status and logs"
          echo "⚠️  This may trigger alerts to the development team"

      - name: Send alert notification
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ ! -z "$SLACK_WEBHOOK" ]; then
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-type: application/json' \
              --data '{"text":"🚨 Bot Worker Health Check Failed\n🔍 Health endpoint is not responding\n⏰ Time: '$(date -Iseconds)'"'
          fi

          if [ ! -z "$DISCORD_WEBHOOK" ]; then
            curl -X POST "$DISCORD_WEBHOOK" \
              -H 'Content-Type: application/json' \
              --data '{"content":"🚨 Bot Worker Health Check Failed\n🔍 Health endpoint is not responding\n⏰ Time: '$(date -Iseconds)'"'
          fi

      - name: Generate health report
        if: always()
        run: |
          echo "📊 Generating health check report..."

          cat << EOF > health-report.md
          # Bot Worker Health Check Report

          **Date:** $(date)  
          **Status:** $(if [ "$GITHUB_STEP" == 'success' ]; then echo '✅ PASS'; else echo '❌ FAIL'; fi)  
          **Worker:** racun-dapur- Ibu Bot
          **Workflow:** GitHub Actions Health Check

          ## Health Check Details

          - **Health Endpoint:** $HEALTH_ENDPOINT
          - **Response Status:** $HTTP_STATUS
          - **Execution Time:** $(date)

          ## Actions Taken

          - [ ] Alert team sent
          - [ ] Investigation initiated
          - [ ] Emergency protocol activated

          ## Next Steps

          1. If failed: Check worker logs and status
          2. If succeeded: Monitor scheduled tasks
          3. If critical: Initiate disaster recovery

          ---
          *This report is automatically generated by GitHub Actions health check workflow*
          EOF

          echo "📄 Health report generated: health-report.md"

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md
          retention-days: 30

      - name: Store health metrics
        if: always()
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          echo "📊 Storing health metrics..."
          echo "Health check completed at $(date -Iseconds)" >> health-metrics.json
          echo '{"timestamp": "'$(date -Iseconds)'", "status": "'$([ "$GITHUB_STEP" == 'success' ] && echo 'healthy' || echo 'unhealthy')'"}' >> health-metrics.json

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Performing cleanup..."
          echo "Cleaning up temporary files"
          rm -f health-report.md health-metrics.json

# Manual health check workflow
name: Manual Health Check

on:
  workflow_dispatch:
    inputs:
      health_endpoint:
        description: "Health endpoint URL"
        required: false
        default: "https://worker.ray.com/health"

jobs:
  manual-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Perform manual health check
        run: |
          echo "🔍 Performing manual health check..."
          echo "Endpoint: ${{ github.event.inputs.health_endpoint || 'https://worker.ray.com/health' }}"

          HEALTH_ENDPOINT="${{ github.event.inputs.health_endpoint || 'https://worker.ray.com/health' }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Manual health check passed"
            curl -s "$HEALTH_ENDPOINT" | jq .
            echo "🎉 Health check successful - worker is operational"
          else
            echo "❌ Manual health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Notify result
        if: success()
        run: |
          echo "✅ Manual health check completed successfully"
          echo "📊 Worker health verified manually"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleanup completed"
