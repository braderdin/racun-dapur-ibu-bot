name: Manual Health Check

on:
  workflow_dispatch:
    inputs:
      health_endpoint:
        description: "Health endpoint URL"
        required: false
        default: "https://racun-dapur-ibu-bot.braderdinyes4g.workers.dev/health"
        type: choice
        options:
          - "https://racun-dapur-ibu-bot.braderdinyes4g.workers.dev/health"

jobs:
  manual-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Perform manual health check
        run: |
          echo "🔍 Performing manual health check..."
          echo "Endpoint: ${{ github.event.inputs.health_endpoint || 'https://racun-dapur-ibu-bot.braderdinyes4g.workers.dev/health' }}"

          HEALTH_ENDPOINT="${{ github.event.inputs.health_endpoint || 'https://racun-dapur-ibu-bot.braderdinyes4g.workers.dev/health' }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Manual health check passed"
            curl -s "$HEALTH_ENDPOINT" | jq .
            echo "🎉 Health check successful - worker is operational"
          else
            echo "❌ Manual health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Notify result
        if: success()
        run: |
          echo "✅ Manual health check completed successfully"
          echo "📊 Worker health verified manually"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleanup completed"
