name: Local Bot Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npx prettier --check .

      - name: Type checking
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run migration script
        run: node bin/migration.cjs

      - name: Run health check
        run: |
          curl -s http://localhost:8787/health || echo "Health check failed (expected for local test)"
