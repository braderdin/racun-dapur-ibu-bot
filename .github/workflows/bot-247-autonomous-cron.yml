name: Bot 24/7 Autonomous Cron

on:
  schedule:
    # Peak MYT windows: 12:30-14:00 MYT (04:30-06:00 UTC) & 20:30-22:30 MYT (12:30-14:30 UTC)
    # Run every 30 minutes during peak windows
    - cron: "30 4-5 * * *" # 12:30-14:00 MYT (04:30-06:00 UTC)
    - cron: "0 5 * * *" # 13:00 MYT
    - cron: "30 5 * * *" # 13:30 MYT
    - cron: "0 6 * * *" # 14:00 MYT
    - cron: "30 12 * * *" # 20:30 MYT (12:30 UTC)
    - cron: "0 13 * * *" # 21:00 MYT
    - cron: "30 13 * * *" # 21:30 MYT
    - cron: "0 14 * * *" # 22:00 MYT
    - cron: "30 14 * * *" # 22:30 MYT
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type (scheduled, manual, test)"
        required: false
        default: "manual"
        type: choice
        options:
          - scheduled
          - manual
          - test

jobs:
  autonomous-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Autonomous Bot Pipeline
        env:
          # Supabase Configuration
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Upstash Redis Configuration
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}

          # Upstash QStash Configuration
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}

          # X (Twitter) API Configuration
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_KEY_SECRET: ${{ secrets.X_CONSUMER_KEY_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

          # Meta Facebook API Configuration
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}

          # Lazada API Configuration
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_MEMBER_ID: ${{ secrets.LAZADA_MEMBER_ID }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_LITEAPP_KEY: ${{ secrets.LAZADA_LITEAPP_KEY }}
          LAZADA_LITEAPP_SECRET: ${{ secrets.LAZADA_LITEAPP_SECRET }}

          # Shopee Affiliate API Configuration
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}
          SHOPEE_AFFILIATE_API_BASE_URL: ${{ secrets.SHOPEE_AFFILIATE_API_BASE_URL }}

          # OpenRouter AI Configuration
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}

          # Backblaze B2 Configuration
          BACKBLAZE_B2_ACCOUNT_ID_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_1 }}
          BACKBLAZE_B2_ACCOUNT_KEY_1: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_1 }}
          BACKBLAZE_B2_ACCOUNT_ID_2: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_2 }}
          BACKBLAZE_B2_ACCOUNT_KEY_2: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_2 }}
          BACKBLAZE_B2_ACCOUNT_ID_3: ${{ secrets.BACKBLAZE_B2_ACCOUNT_ID_3 }}
          BACKBLAZE_B2_ACCOUNT_KEY_3: ${{ secrets.BACKBLAZE_B2_ACCOUNT_KEY_3 }}

          # Cloudflare Configuration
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          # Telegram Configuration
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Discord Webhook for alerts
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Shortlink Domain
          SHORTLINK_DOMAIN: ${{ secrets.SHORTLINK_DOMAIN }}

        run: |
          echo "🤖 Starting Bot 24/7 Autonomous Cron"
          echo "📅 Trigger: ${{ github.event_name }}"
          echo "🏷️  Run type: ${{ github.event.inputs.run_type }}"
          echo "⏰ Timestamp: $(date -Iseconds)"
          echo "🌏 Timezone: MYT (UTC+8)"

          # Check if we're in peak hours
          CURRENT_HOUR_UTC=$(date -u +%H)
          CURRENT_MIN_UTC=$(date -u +%M)
          echo "🕐 Current UTC time: ${CURRENT_HOUR_UTC}:${CURRENT_MIN_UTC}"

          # Run the autonomous bot pipeline
          node bin/run-live-bot-e2e.js --mode=autonomous --peak-hours

      - name: Verify Worker Health
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          echo "🔍 Verifying worker health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/health")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Worker health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Worker health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Notify on Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "✅ Autonomous cron completed successfully"
          if [ ! -z "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data '{"content":"✅ Bot 24/7 Autonomous Cron Completed\n🕐 Time: '$(date -Iseconds)'\n🌏 Peak MYT window execution\n📊 All systems operational"}'
          fi

      - name: Notify on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "❌ Autonomous cron failed"
          if [ ! -z "$DISCORD_WEBHOOK_URL" ]; then
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              --data '{"content":"🚨 Bot 24/7 Autonomous Cron Failed\n🔍 Check workflow logs for details\n⏰ Time: '$(date -Iseconds)'\n🌏 Peak MYT window"}'
          fi

      - name: Generate Execution Report
        if: always()
        run: |
          echo "📊 Generating execution report..."
          cat << EOF > autonomous-cron-report.md
          # Bot 24/7 Autonomous Cron Report

          **Date:** $(date -Iseconds)
          **Status:** $(if [ "${{ job.status }}" == 'success' ]; then echo '✅ SUCCESS'; else echo '❌ FAILURE'; fi)
          **Trigger:** ${{ github.event_name }}
          **Run Type:** ${{ github.event.inputs.run_type }}
          **Workflow:** bot-247-autonomous-cron.yml
          **Repository:** braderdin/racun-dapur-ibu-bot
          **Peak Windows:** 12:30-14:00 MYT & 20:30-22:30 MYT
          **Schedule:** Every 30 minutes during peak windows
          EOF
          echo "📄 Execution report saved"
