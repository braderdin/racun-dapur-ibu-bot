name = "racun-dapur-ibu-bot"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

# Cloudflare API Keys (simpan sebagai lingkungan binding)
[env]
# Workers bindings untuk external services (hanya reference env var)
UPSTASH_REDIS_REST_URL = "${UPSTASH_REDIS_REST_URL}"
UPSTASH_REDIS_REST_TOKEN = "${UPSTASH_REDIS_REST_TOKEN}"
UPSTASH_QSTASH_URL = "${UPSTASH_QSTASH_URL}"
UPSTASH_QSTASH_TOKEN = "${UPSTASH_QSTASH_TOKEN}"
SUPABASE_URL = "${SUPABASE_URL}"
SUPABASE_SERVICE_ROLE_KEY = "${SUPABASE_SERVICE_ROLE_KEY}"
SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
X_API_KEY = "${X_API_KEY}"
X_BEARER_TOKEN = "${X_BEARER_TOKEN}"
LAZADA_CLIENT_ID = "${LAZADA_CLIENT_ID}"
LAZADA_CLIENT_SECRET = "${LAZADA_CLIENT_SECRET}"
LAZADA_ACCESS_TOKEN = "${LAZADA_ACCESS_TOKEN}"
BACKBLAZE_B2_ACCOUNT_ID_1 = "${BACKBLAZE_B2_ACCOUNT_ID_1}"
BACKBLAZE_B2_ACCOUNT_KEY_1 = "${BACKBLAZE_B2_ACCOUNT_KEY_1}"
BACKBLAZE_B2_ACCOUNT_ID_2 = "${BACKBLAZE_B2_ACCOUNT_ID_2}"
BACKBLAZE_B2_ACCOUNT_KEY_2 = "${BACKBLAZE_B2_ACCOUNT_KEY_2}"
BACKBLAZE_B2_ACCOUNT_ID_3 = "${BACKBLAZE_B2_ACCOUNT_ID_3}"
BACKBLAZE_B2_ACCOUNT_KEY_3 = "${BACKBLAZE_B2_ACCOUNT_KEY_3}"
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
OPENROUTER_BASE_URL = "${OPENROUTER_BASE_URL}"
FACEBOOK_APP_ID = "${FACEBOOK_APP_ID}"
FACEBOOK_APP_SECRET = "${FACEBOOK_APP_SECRET}"
FACEBOOK_PAGE_ACCESS_TOKEN = "${FACEBOOK_PAGE_ACCESS_TOKEN}"
FACEBOOK_PAGE_ID = "${FACEBOOK_PAGE_ID}"

# Penjadual Otomatik Cron Trigger (Setiap 2 jam)
[triggers]
crons = ["0 */2 * * *"]

# Otomatis pembaruan storage usage check (default kurang lebih 4GB di setiap account)
[vars]
ENVIRONMENT = "production"
STORAGE_CAP_GB = "9"
MAX_STORAGE_CAP_GB = "27"
REDIS_TTL_SECONDS = "432000"
OPENROUTER_REQUEST_DELAY_MS = "3000"
X_API_RETRY_COUNT = "3"
